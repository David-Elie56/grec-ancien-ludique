<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ἡ γλῶττα · Grec Ancien Ludique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f2740;
  --ink2:#163a5c;
  --ink3:#1f4a72;
  --gold:#b8935a;
  --gold-light:#d9bb85;
  --gold-dim:#8a6f42;
  --marble:#f3f0e6;
  --marble2:#e7e0cc;
  --paper:#fbf9f1;
  --text:#22201a;
  --text-soft:#5a5546;
  --red:#8a3324;
  --green:#3f6b4f;
  --shadow:0 10px 30px rgba(15,39,64,.13);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--marble);
  background-image:
    radial-gradient(ellipse at top left, rgba(184,147,90,.10), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(15,39,64,.07), transparent 55%);
  color:var(--text);
  font-family:'Gentium Plus', serif;
  min-height:100vh;
}
.gr{
  font-family:'Gentium Plus', serif;
  font-size:1.55em;
  line-height:1.5;
  cursor:pointer;
  color:var(--ink2);
}
.gr:hover{ text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--gold-dim); text-underline-offset:4px; }
.gr.playing{ color:var(--gold-dim); }
.gr-static{ font-family:'Gentium Plus', serif; font-size:1.55em; line-height:1.5; }
h1,h2,h3,h4{ font-family:'Cormorant Garamond', serif; color:var(--ink); margin:0 0 .4em 0; letter-spacing:.01em; }
.ui{font-family:'Inter', sans-serif;}
a{color:inherit;}
button{font-family:'Inter', sans-serif; cursor:pointer;}

#shell{ display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
.sidebar{
  background:linear-gradient(180deg, var(--ink) 0%, var(--ink2) 100%);
  color:var(--marble2); padding:28px 18px 24px; position:relative; overflow:hidden;
}
.sidebar::before{
  content:"Ω"; position:absolute; font-family:'Cormorant Garamond',serif; font-size:340px; font-weight:700;
  color:rgba(255,255,255,.035); top:-60px; left:-70px; line-height:1; pointer-events:none;
}
.brand{ display:flex; align-items:center; gap:12px; margin-bottom:22px; position:relative; }
.brand .mark{
  width:42px;height:42px;border-radius:50%; border:1.5px solid var(--gold-light);
  display:flex;align-items:center;justify-content:center; font-family:'Cormorant Garamond',serif;
  font-size:22px;color:var(--gold-light); flex:none;
}
.brand .name{font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:600;color:var(--marble);}
.brand .sub{font-size:11px;color:var(--gold-light);opacity:.8;}

.statbar{ display:flex; gap:14px; margin-bottom:20px; position:relative; }
.statchip{ font-family:'Inter',sans-serif; font-size:11.5px; color:var(--marble2); background:rgba(255,255,255,.06);
  border:1px solid rgba(217,187,133,.25); border-radius:9px; padding:8px 10px; flex:1; text-align:center; }
.statchip b{ display:block; font-size:16px; color:var(--gold-light); font-family:'Cormorant Garamond',serif; }

.navgroup{margin-bottom:8px;position:relative;}
.navgroup .label{ font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold-light);opacity:.75; margin:0 0 8px 4px; }
.navitem{ display:flex;align-items:center;gap:10px; padding:9px 10px;border-radius:9px; font-size:14px;color:var(--marble2);
  cursor:pointer;border:1px solid transparent; transition:background .15s, border-color .15s; margin-bottom:2px; }
.navitem .num{ font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--gold-light); width:22px;text-align:center;flex:none; }
.navitem:hover{background:rgba(255,255,255,.06);}
.navitem.active{background:rgba(184,147,90,.20);border-color:rgba(217,187,133,.35);color:#fff;}
.navitem.done .num::after{content:" ✓"; font-size:10px;}

main{ padding:34px 44px 70px; max-width:980px; }
.topline{ display:flex;align-items:baseline;justify-content:space-between; border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:22px; gap:16px;flex-wrap:wrap; }
.topline .eyebrow{ font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.16em; text-transform:uppercase;color:var(--gold-dim);margin-bottom:4px; }
.topline h1{font-size:30px;margin:0;}
.topline .grtitle{font-family:'Gentium Plus',serif;font-size:19px;color:var(--gold-dim);margin-top:2px;}

.tabbar{ display:flex; gap:6px; margin-bottom:22px; }
.tabbtn{ font-family:'Inter',sans-serif;font-size:13px;font-weight:600; padding:9px 16px;border-radius:9px 9px 0 0;
  border:1px solid var(--marble2); border-bottom:none; background:var(--marble2); color:var(--text-soft); }
.tabbtn.active{ background:var(--paper); color:var(--ink); border-color:var(--gold-dim); }

.card{ background:var(--paper); border:1px solid var(--marble2); border-radius:var(--radius);
  padding:22px 26px; margin-bottom:20px; box-shadow:var(--shadow); position:relative; }
.card h3{font-size:19px;margin-bottom:.55em;color:var(--ink2);}
.card h3 .en{font-family:'Inter',sans-serif;font-size:11px;color:var(--gold-dim);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px;}
.card p{line-height:1.65;color:var(--text);margin:0 0 12px;}
.card p:last-child{margin-bottom:0;}
.rule{ background:var(--marble); border-left:3px solid var(--gold); padding:10px 16px;border-radius:0 8px 8px 0;
  margin:12px 0;font-size:15px;line-height:1.6; }
.example{ display:flex;align-items:center;gap:16px;flex-wrap:wrap; background:rgba(184,147,90,.08);
  border:1px dashed var(--gold-dim); border-radius:10px; padding:10px 16px;margin:8px 0; }
.example .gr{font-size:1.3em;color:var(--ink2);}
.example .fr{font-family:'Inter',sans-serif;font-size:13px;color:var(--text-soft);}
.example .tr{font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-dim);font-style:italic;}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0;}
table.gridtbl{ width:100%;border-collapse:collapse;font-size:16px; }
table.gridtbl th{ font-family:'Inter',sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  background:var(--ink2);color:var(--marble); padding:9px 11px;text-align:left; }
table.gridtbl td{ padding:9px 11px;border-bottom:1px solid var(--marble2); vertical-align:middle; }
table.gridtbl tr:nth-child(even) td{background:rgba(184,147,90,.06);}
table.gridtbl caption{caption-side:top;text-align:left;font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-dim);letter-spacing:.06em;text-transform:uppercase;padding-bottom:6px;}

.callout{ border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14px;line-height:1.55; display:flex;gap:10px;align-items:flex-start; }
.callout.warn{background:#fbeae5;border:1px solid #e3b6a8;color:#6b2c1c;}
.callout.info{background:#e9f0f5;border:1px solid #b7cfe0;color:#1b3a52;}
.callout .ico{font-size:16px;flex:none;}

.lesson-nav{ display:flex;justify-content:space-between;margin-top:26px;gap:10px; }
.navbtn{ font-family:'Inter',sans-serif;font-size:13px;font-weight:600; background:var(--ink);color:var(--marble);
  border:none;border-radius:9px; padding:10px 16px;display:flex;align-items:center;gap:8px; transition:background .15s; }
.navbtn:hover{background:var(--ink3);}
.navbtn:disabled{opacity:.35;cursor:default;}
.btn-ghost{ font-family:'Inter',sans-serif;font-size:13px;font-weight:600;background:transparent;color:var(--ink2);
  border:1.5px solid var(--gold-dim);border-radius:9px;padding:9px 14px; }

.vocab-grid{ display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px; }
.vcard{ background:var(--paper);border:1px solid var(--marble2);border-radius:12px; padding:16px;box-shadow:var(--shadow);
  min-height:120px;display:flex;flex-direction:column;justify-content:space-between; transition:transform .12s; }
.vcard:hover{transform:translateY(-2px);}
.vcard .front .gr{font-size:1.7em;color:var(--ink2);display:block;}
.vcard .front .tr{font-family:'Inter',sans-serif;font-size:12px;color:var(--gold-dim);font-style:italic;}
.vcard .back{font-family:'Inter',sans-serif;font-size:13.5px;color:var(--text);margin-top:10px;padding-top:10px;border-top:1px solid var(--marble2);}
.playbtn{ border:none;background:var(--marble);border-radius:50%;width:30px;height:30px;font-size:13px; }

.progressbar{height:6px;background:var(--marble2);border-radius:6px;overflow:hidden;margin-bottom:20px;}
.progressbar div{height:100%;background:var(--gold);transition:width .2s;}

.qbox{ background:var(--paper);border:1px solid var(--marble2);border-radius:14px; padding:26px;box-shadow:var(--shadow); }
.qbox .qprompt{padding:6px 0 20px;}
.qbox .qprompt .gr{font-size:1.9em;color:var(--ink2);display:block;margin-bottom:6px;}
.qbox .qprompt .fr{font-family:'Inter',sans-serif;font-size:16px;color:var(--text);}
.optiongrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:620px;}
.optbtn{ font-family:'Inter',sans-serif;font-size:14px;padding:13px 16px;border-radius:10px;
  border:1.5px solid var(--marble2); background:var(--marble); text-align:left; }
.optbtn:hover{border-color:var(--gold-dim);}
.optbtn.correct{background:#e2f0e6;border-color:var(--green);color:#1f4a30;}
.optbtn.wrong{background:#fbe4de;border-color:var(--red);color:#6b2416;}
.optbtn:disabled{cursor:default;}
.answerrow{display:flex;gap:10px;flex-wrap:wrap;max-width:620px;}
.answerrow input[type=text]{ font-family:'Gentium Plus',serif;font-size:18px;padding:10px 14px;border-radius:9px;
  border:1.5px solid var(--marble2);background:var(--marble);flex:1;min-width:220px; }
.explain{ font-family:'Inter',sans-serif;font-size:13px;color:var(--text-soft);background:var(--marble);
  border-radius:8px;padding:10px 14px;margin-top:16px; display:none; }
.explain.show{display:block;}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:10px;}
.qmeta{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text-soft);}
.resultbox{text-align:center;padding:20px 0;}
.resultbox .score{font-family:'Cormorant Garamond',serif;font-size:44px;color:var(--ink2);}
.badge{ display:inline-block;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;background:var(--gold);
  color:#fff;border-radius:20px;padding:6px 14px;margin-top:10px; }

.toast{ position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--marble);font-family:'Inter',sans-serif;
  font-size:13px;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);
  transition:opacity .25s, transform .25s;pointer-events:none;z-index:50; }
.toast.show{opacity:1;transform:translateY(0);}

@media (max-width:820px){
  #shell{grid-template-columns:1fr;}
  .sidebar{
    padding:14px 14px 10px; position:relative; z-index:5;
  }
  .sidebar::before{ display:none; }
  .brand{ margin-bottom:12px; }
  .brand .sub{ display:none; }
  .userbadge{ margin-bottom:10px; }
  .statbar{ margin-bottom:12px; gap:8px; }
  .statchip{ padding:6px 6px; font-size:10.5px; }
  .statchip b{ font-size:14px; }
  .navgroup .label{ display:none; }
  .navgroup{
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:6px; margin:0 -14px; padding-left:14px; padding-right:14px;
  }
  .navitem{
    flex:none; margin-bottom:0; white-space:nowrap; padding:8px 12px;
    background:rgba(255,255,255,.05); border:1px solid rgba(217,187,133,.18);
  }
  main{ padding:18px 14px 60px; }
  .topline h1{ font-size:24px; }
  .topline .grtitle{ font-size:16px; }
  .tabbar{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabbtn{ flex:none; padding:9px 14px; font-size:12.5px; }
  .card{ padding:16px 16px; }
  .gr{ font-size:1.3em; }
  .gr-static{ font-size:1.3em; }
  .example{ padding:9px 12px; gap:8px; }
  .example .gr{ font-size:1.15em; }
  .vocab-grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .vcard{ padding:12px; min-height:100px; }
  .vcard .front .gr{ font-size:1.4em; }
  table.gridtbl{ font-size:13.5px; }
  table.gridtbl th, table.gridtbl td{ padding:7px 8px; }
  .optiongrid{grid-template-columns:1fr;}
  .optbtn{ padding:14px 14px; font-size:14.5px; }
  .qbox .qprompt .gr{ font-size:1.5em; }
  .authcard{ padding:26px 22px; }
  .lesson-nav{ position:sticky; bottom:0; background:var(--marble); padding:10px 0 4px; margin-top:16px; }
  .navbtn, .btn-ghost{ padding:11px 14px; }
}
@media (max-width:420px){
  .statbar{ flex-wrap:wrap; }
  .statchip{ min-width:calc(33% - 6px); }
}

/* ---------- écran de connexion / réglages ---------- */
.authscreen{
  position:fixed;inset:0;z-index:100;
  background:var(--marble);
  background-image:
    radial-gradient(ellipse at top left, rgba(184,147,90,.12), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(15,39,64,.09), transparent 55%);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.authcard{
  background:var(--paper);border:1px solid var(--marble2);border-radius:18px;
  box-shadow:var(--shadow);padding:34px 36px;max-width:400px;width:100%;
}
.authcard .mark2{
  width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;
  font-size:26px;color:var(--gold-dim);margin:0 auto 14px;
}
.authcard h2{font-size:23px;text-align:center;}
.authcard .sub{font-family:'Inter',sans-serif;font-size:13px;color:var(--text-soft);text-align:center;margin-bottom:20px;}
.authcard label{font-family:'Inter',sans-serif;font-size:12px;color:var(--text-soft);display:block;margin:12px 0 5px;}
.authcard input[type=text],.authcard input[type=password]{
  width:100%;font-family:'Inter',sans-serif;font-size:14.5px;padding:11px 13px;border-radius:9px;
  border:1.5px solid var(--marble2);background:var(--marble);
}
.authcard .navbtn{width:100%;justify-content:center;margin-top:18px;padding:12px;font-size:14px;}
.authcard .altlink{ display:block;text-align:center;font-family:'Inter',sans-serif;font-size:12.5px;
  color:var(--gold-dim);margin-top:14px;background:none;border:none;text-decoration:underline;width:100%;}
.authcard .errmsg{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--red);margin-top:10px;text-align:center;min-height:16px;}
.userbadge{ display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(255,255,255,.06);border:1px solid rgba(217,187,133,.25);border-radius:9px;
  padding:8px 10px;margin-bottom:16px;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--marble2);}
.userbadge button{background:none;border:none;color:var(--gold-light);font-size:11.5px;text-decoration:underline;}
</style>
</head>
<body>
<div id="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   DONNÉES : LEÇONS DE GREC ANCIEN
   ========================================================================= */
const ALPHABET = [
 ["Α","α","alpha","a (bref ou long)"],
 ["Β","β","bêta","b"],
 ["Γ","γ","gamma","g dur (« gare ») ; se prononce « n » devant γ, κ, χ, ξ"],
 ["Δ","δ","delta","d"],
 ["Ε","ε","epsilon","e bref"],
 ["Ζ","ζ","dzêta","dz"],
 ["Η","η","êta","è long (« tête »)"],
 ["Θ","θ","thêta","t aspiré (« th » anglais de « think »)"],
 ["Ι","ι","iota","i (bref ou long)"],
 ["Κ","κ","kappa","k (« corde »)"],
 ["Λ","λ","lambda","l"],
 ["Μ","μ","mu","m"],
 ["Ν","ν","nu","n"],
 ["Ξ","ξ","ksi","x (« boxe »)"],
 ["Ο","ο","omicron","o bref"],
 ["Π","π","pi","p"],
 ["Ρ","ρ","rhô","r"],
 ["Σ","σ / ς","sigma","s dur — s'écrit ς en fin de mot"],
 ["Τ","τ","tau","t"],
 ["Υ","υ","upsilon","u (proche du « ü » allemand)"],
 ["Φ","φ","phi","p aspiré, rendu par « ph »"],
 ["Χ","χ","khi","kh guttural (« Bach » allemand)"],
 ["Ψ","ψ","psi","ps (« boxe »)"],
 ["Ω","ω","oméga","o long ouvert"]
];

const LESSONS = [
{
  title:"L'alphabet grec", grTitle:"Τὸ ἀλφάβητον",
  blocks:[
    {type:'p', text:"L'alphabet grec compte 24 lettres. C'est de lui que dérivent l'alphabet latin (donc le nôtre) et l'alphabet cyrillique. On utilise ici la prononciation dite « érasmienne », en usage traditionnel dans l'enseignement francophone du grec ancien."},
    {type:'table', caption:'Les 24 lettres', headers:['Majuscule','Minuscule','Nom','Prononciation'],
     rows: ALPHABET.map(l=>[l[0],l[1],l[2],l[3]]), greekCols:[0,1]},
    {type:'callout', kind:'info', text:"Clique sur n'importe quelle lettre ou n'importe quel mot grec de ce cours pour l'entendre : ton navigateur le lira à voix haute."},
    {type:'p', text:"Beaucoup de mots grecs sont passés presque tels quels dans notre vocabulaire savant : λόγος a donné « logique » et tous les mots en « -logie » ; ψυχή a donné « psychologie » ; κόσμος a donné « cosmos » et « cosmétique »."}
  ],
  vocab:[
    {gr:"λόγος", tr:"lógos", fr:"la parole, le discours, la raison"},
    {gr:"φιλία", tr:"philía", fr:"l'amitié"},
    {gr:"ψυχή", tr:"psukhế", fr:"l'âme, le souffle"},
    {gr:"θεός", tr:"theós", fr:"le dieu"},
    {gr:"ἄνθρωπος", tr:"ánthrōpos", fr:"l'être humain"},
    {gr:"κόσμος", tr:"kósmos", fr:"le monde, l'ordre, la parure"}
  ],
  exercises:[
    {type:'qcm', q:"Quelle lettre porte le nom de « thêta » ?", opts:['Θ θ','Τ τ','Φ φ','Χ χ'], correct:0, explain:"Θ θ (thêta) se prononce comme le « th » anglais de « think »."},
    {type:'qcm', q:"Quelle lettre transcrit le son « ph » (comme dans « photo ») ?", opts:['Π π','Φ φ','Ψ ψ','Χ χ'], correct:1, explain:"Φ φ (phi) est un « p » aspiré, rendu en français par « ph »."},
    {type:'qcm', q:"En fin de mot, le sigma s'écrit toujours…", opts:['σ','ς','σσ','ζ'], correct:1, explain:"Le sigma final prend la forme ς, par exemple λόγος."},
    {type:'text', q:"Écris le nom (en français) de la lettre Ψ ψ.", accepted:['psi'], explain:"Ψ ψ se nomme « psi » et transcrit le groupe « ps »."},
    {type:'text', q:"Écris le nom (en français) de la lettre Ω ω.", accepted:['omega','oméga'], explain:"Ω ω, « oméga », est un o long ouvert — l'opposé d'Ο ο (omicron), o bref."}
  ]
},
{
  title:"Esprits, accents et diphtongues", grTitle:"Πνεύματα καὶ τόνοι",
  blocks:[
    {type:'p', text:"Deux catégories de signes accompagnent les mots grecs : les esprits, qui notent (ou non) une aspiration, et les accents, qui notaient à l'origine une mélodie de la voix."},
    {type:'rule', text:"<b>Esprit doux « ᾿ »</b> = absence d'aspiration. <b>Esprit rude « ῾ »</b> = aspiration, transcrite en français par un « h » (ex. ὑπό → « hypo- », ῥήτωρ → « rhéteur »). Tout mot commençant par une voyelle, une diphtongue, ou par ρ, porte obligatoirement un esprit ; υ et ρ initiaux sont toujours rudes."},
    {type:'example', items:[
      {gr:'ἀγαθός', tr:'agathós', fr:"bon (esprit doux) — cf. « Agathe »"},
      {gr:'ὑποκριτής', tr:'hupokritếs', fr:"acteur (esprit rude) — cf. « hypocrite »"}
    ]},
    {type:'rule', text:"Presque tous les mots portent aussi un accent : aigu « ´ » (βάρβαρος), grave « ` » (τὸ δένδρον) ou circonflexe « ῀ » (σῶμα). En usage scolaire, on se contente en général de marquer légèrement la syllabe accentuée."},
    {type:'table', caption:'Les diphtongues et leur prononciation', headers:['Diphtongue','Se prononce comme'],
     rows:[['αι','« ai » de rail'],['οι','« oy » anglais (boy)'],['ει','« éi » de réveil'],['ου','« ou » de fou'],
           ['αυ','« aou » (comme « aurum » latin)'],['ευ','« eu » de feu'],['ᾳ ῃ ῳ','a / ê / ô longs — le iota souscrit ne se prononce pas']],
     greekCols:[0]},
    {type:'callout', kind:'warn', text:"Le tréma « ¨ » indique au contraire que deux voyelles voisines ne forment PAS une diphtongue : Τρωϊκός se lit en trois syllabes [tro-i-kos]."},
    {type:'table', caption:'Ponctuation : grec vs français', headers:['Signe grec','Équivaut à'],

{
  title:"L'imparfait", grTitle:"Ὁ παρατατικός",
  blocks:[
    {type:'p', text:"L'imparfait exprime une action passée envisagée dans sa durée, sa répétition ou son déroulement (« je déliais », « j'étais en train de délier ») — par opposition à l'aoriste, qui présente l'action comme un simple fait ponctuel. Il se forme sur le thème du présent, précédé de l'augment et suivi des désinences dites « secondaires »."},
    {type:'rule', text:"L'<b>augment</b> ἐ- se place devant les verbes commençant par une consonne (λύω → ἔλυον). Devant une voyelle, l'augment se fond avec elle et l'allonge (ce qu'on appelle l'augment temporel)."},
    {type:'table', caption:"Imparfait de λύω et de εἰμί", headers:['Personne','λύω → je déliais','εἰμί → j\'étais'],
     rows:[['1sg','ἔλυον','ἦν'],['2sg','ἔλυες','ἦσθα'],['3sg','ἔλυε(ν)','ἦν'],['1pl','ἐλύομεν','ἦμεν'],['2pl','ἐλύετε','ἦτε'],['3pl','ἔλυον','ἦσαν']]},
    {type:'callout', kind:'info', text:"Astuce : à la 1ère et à la 3e personne du singulier, l'imparfait actif de λύω se ressemble (ἔλυον) — seul le contexte ou le sujet exprimé permet de trancher, exactement comme en français « je parlais » / « il parlait » ne se confondent pas mais où bien d'autres formes, elles, sont ambiguës."},
    {type:'example', items:[
      {gr:'ὁ ἄνθρωπος ἔγραφεν', tr:'ho ánthrōpos égraphen', fr:"l'homme écrivait"}
    ]}
  ],
  vocab:[],
  exercises:[

    {type:'qcm', q:"L'augment ἐ- se place…", opts:["à la fin du verbe","devant le thème du verbe","seulement au pluriel","seulement à l'aoriste"], correct:1, explain:"L'augment se place devant le thème verbal, marque du passé (imparfait et aoriste)."},
    {type:'qcm', q:'« Tu déliais » se dit…', opts:['ἔλυον','ἔλυες','ἔλυε','ἐλύετε'], correct:1, explain:"ἔλυες = tu déliais (2e pers. sg.)."},
    {type:'qcm', q:"« Nous étions » (imparfait de εἰμί) se dit…", opts:['ἐσμέν','ἦμεν','ἦσαν','ἐστέ'], correct:1, explain:"ἦμεν = nous étions."},
    {type:'text', q:"Écris l'imparfait 3e pers. pl. de λύω (« ils déliaient »).", accepted:['ἔλυον','ελυον'], explain:"ἔλυον sert à la fois de 1ère personne du singulier et de 3e personne du pluriel."}
  ]
},
{
  title:"Le futur et l'aoriste", grTitle:"Ὁ μέλλων καὶ ὁ ἀόριστος",
  blocks:[
    {type:'p', text:"Le futur (« je délierai ») se forme en ajoutant un suffixe -σ- au radical, suivi des désinences actives déjà connues. L'aoriste (« je déliai », le passé « simple » du grec, qui présente l'action comme un fait ponctuel et global) combine l'augment du passé avec ce même suffixe -σ-, et des désinences propres."},
    {type:'table', caption:"Futur et aoriste actifs de λύω", headers:['Personne','Futur : je délierai','Aoriste : je déliai'],
     rows:[['1sg','λύσω','ἔλυσα'],['2sg','λύσεις','ἔλυσας'],['3sg','λύσει','ἔλυσε(ν)'],['1pl','λύσομεν','ἐλύσαμεν'],['2pl','λύσετε','ἐλύσατε'],['3pl','λύσουσι(ν)','ἔλυσαν']]},
    {type:'rule', text:"Repère les signaux : le <b>futur</b> ajoute -σ- sans augment (λύ<b>σ</b>ω) ; l'<b>aoriste</b> combine l'augment ἐ- ET le -σ- (<b>ἐ</b>λύ<b>σ</b>α), avec des désinences différentes de l'imparfait (-α, -ας, -ε, -αμεν, -ατε, -αν)."},
    {type:'callout', kind:'warn', text:"Devant les consonnes finales du radical, le -σ- se combine parfois : γράφω (radical γραφ-) donne au futur γράψω et à l'aoriste ἔγραψα (φ + σ → ψ). C'est un simple ajustement phonétique, pas une exception à apprendre par cœur mot à mot."}
  ],
  vocab:[],
  exercises:[
    {type:'qcm', q:"Le futur de λύω se forme en ajoutant au radical…", opts:['un augment','le suffixe -σ-','le suffixe -θη-','rien de particulier'], correct:1, explain:"Le suffixe sigmatique -σ- caractérise le futur (et l'aoriste sigmatique)."},
    {type:'qcm', q:"Ce qui distingue l'aoriste du futur, c'est…", opts:["l'aoriste n'a pas de -σ-","l'aoriste porte en plus l'augment","le futur porte l'augment, pas l'aoriste","aucune différence"], correct:1, explain:"L'aoriste = augment + -σ- + désinences propres ; le futur n'a pas d'augment."},
    {type:'qcm', q:'« Il déliera » (futur) se dit…', opts:['λύει','λύσει','ἔλυσε','ἔλυε'], correct:1, explain:"λύσει = il/elle déliera."},
    {type:'text', q:"Écris l'aoriste 1ère pers. sg. de λύω (« je déliai »).", accepted:['ἔλυσα','ελυσα'], explain:"ἔλυσα, augment ἐ- + radical λυ- + suffixe -σ- + désinence -α."},
    {type:'qcm', q:"γράφω (j'écris) donne à l'aoriste, après ajustement phonétique…", opts:['ἔγραφσα','ἔγραψα','ἔγραβσα','ἐγράφησα'], correct:1, explain:"φ + σ se combinent en ψ : ἔγραψα."}
  ]
},
{
  title:"L'ordre des mots et les particules", grTitle:"Ἡ τάξις τῶν λέξεων",
  blocks:[
    {type:'p', text:"Parce que le cas indique la fonction grammaticale (et non la place dans la phrase), l'ordre des mots est beaucoup plus libre en grec qu'en français : sujet, verbe et compléments peuvent presque se permuter sans changer le sens strict, seule l'emphase change. En prose classique, le verbe se trouve toutefois très souvent en fin de proposition."},
    {type:'rule', text:"Certains petits mots très fréquents, appelés <b>particules</b>, ne peuvent jamais ouvrir une phrase : on dit qu'ils sont <b>postpositifs</b>. C'est le cas de δέ (« mais, or, et »), γάρ (« car, en effet »), οὖν (« donc ») et μέν (annonce souvent un δέ à venir). Ils se placent en général juste après le premier mot de la proposition."},
    {type:'example', items:[
      {gr:'ὁ μὲν λόγος καλός, ὁ δὲ βίος αἰσχρός', tr:'ho mèn lógos kalós, ho dè bíos aiskhrós', fr:"le discours, lui, est beau, mais la vie est honteuse (structure « μέν... δέ... » = « d'un côté... de l'autre »)"}
    ]},
    {type:'callout', kind:'info', text:"Repérer μέν... δέ... est l'un des réflexes les plus utiles en grec : c'est la charpente de très nombreuses phrases d'opposition ou d'énumération, même quand la traduction française n'a besoin d'aucun mot pour le premier terme."}
  ],
  vocab:[
    {gr:"δέ", tr:"dé", fr:"mais, or, et (postpositif)"},
    {gr:"γάρ", tr:"gár", fr:"car, en effet (postpositif)"},
    {gr:"μέν ... δέ ...", tr:"mén ... dé ...", fr:"d'un côté ... de l'autre ..."},
    {gr:"οὖν", tr:"oûn", fr:"donc (postpositif)"},
    {gr:"ἀλλά", tr:"allá", fr:"mais (en tête de phrase)"}
  ],
  exercises:[
    {type:'qcm', q:"Un mot « postpositif » comme δέ ou γάρ…", opts:['ouvre toujours la phrase','ne peut jamais ouvrir la phrase','se place seulement à la fin','ne se rencontre qu\'en poésie'], correct:1, explain:"Les postpositifs comme δέ, γάρ, οὖν se placent après le premier mot de la proposition, jamais en tête."},
    {type:'qcm', q:"La construction μέν... δέ... sert à exprimer…", opts:['une question','une opposition ou une double énumération','une négation','un ordre'], correct:1, explain:"μέν annonce un premier terme, δέ introduit le second, en opposition ou en parallèle."},
    {type:'qcm', q:"Contrairement au français, l'ordre des mots grec est plus libre parce que…", opts:["le grec n'a pas de verbe","les cas indiquent déjà la fonction des mots","il n'y a pas d'article en grec","le grec n'a pas de sujet"], correct:1, explain:"Le marquage casuel (nominatif, accusatif...) rend l'ordre des mots secondaire pour comprendre la fonction de chacun."},
    {type:'qcm', q:"« Car, en effet » se dit…", opts:['δέ','γάρ','οὖν','ἀλλά'], correct:1, explain:"γάρ introduit une explication ou une justification."},
    {type:'text', q:"Contrairement à γάρ et δέ, quel mot de la liste ci-dessus peut ouvrir une phrase (« mais ») ?", accepted:['ἀλλά','αλλα'], explain:"ἀλλά, contrairement aux particules postpositives, peut se placer en tête de phrase."}
  ]
},
{

  blocks:[
    {type:'p', text:"Rien de tel que des formules célèbres, transmises depuis plus de 2000 ans, pour terminer ce premier parcours et se donner envie d'aller plus loin. En voici cinq, à lire — et à écouter — à voix haute."},

    {type:'callout', kind:'info', text:"Remarque la construction μέν... δέ... implicite dans la dernière phrase d'Hippocrate : « ὁ βίος βραχύς » pose le premier terme, « ἡ δὲ τέχνη μακρή » (introduit par δέ) lui répond en écho — exactement le réflexe vu à la leçon précédente."}

  ]
},
{
  title:"Les pronoms personnels", grTitle:"Αἱ ἀντωνυμίαι",
  blocks:[
    {type:'p', text:"Comme la terminaison du verbe indique déjà la personne (λύω = « je délie », sans qu'il soit besoin d'ajouter « je »), le grec n'utilise les pronoms personnels sujets que pour insister. En revanche, aux autres cas (accusatif, génitif, datif), ils sont indispensables comme en français."},
    {type:'table', caption:"Ἐγώ, σύ, ἡμεῖς, ὑμεῖς — je, tu, nous, vous", headers:['Cas','1sg (je)','2sg (tu)','1pl (nous)','2pl (vous)'],
     rows:[['Nom.','ἐγώ','σύ','ἡμεῖς','ὑμεῖς'],['Acc.','ἐμέ / με','σέ / σε','ἡμᾶς','ὑμᾶς'],['Gén.','ἐμοῦ / μου','σοῦ / σου','ἡμῶν','ὑμῶν'],['Dat.','ἐμοί / μοι','σοί / σοι','ἡμῖν','ὑμῖν']]},
    {type:'rule', text:"Chaque pronom (sauf au nominatif) a une forme accentuée, insistante (ἐμοῦ, ἐμοί...) et une forme atone, plus légère (μου, μοι...). Le grec emploie la forme atone par défaut, et réserve la forme accentuée à l'insistance, au début de phrase ou après une préposition."},
    {type:'p', text:"Il n'existe pas de vrai pronom « il / elle » non réfléchi à la 3e personne : le grec utilise à la place une forme du mot αὐτός, αὐτή, αὐτό, qui se décline comme un adjectif de la 1ère/2e déclinaison."},
    {type:'example', items:[
      {gr:'αὐτὸν ὁρῶ', tr:'autòn horỗ', fr:"je le vois (lui)"},
      {gr:'ἐμαυτὸν οὐ φιλῶ', tr:'emautòn ou philỗ', fr:"je ne m'aime pas (réfléchi : moi-même)"}
    ]}
  ],
  vocab:[
    {gr:"ἐγώ", tr:"egṓ", fr:"je, moi"},
    {gr:"σύ", tr:"sú", fr:"tu, toi"},
    {gr:"ἡμεῖς", tr:"hēmeîs", fr:"nous"},
    {gr:"ὑμεῖς", tr:"humeîs", fr:"vous"},
    {gr:"αὐτός, αὐτή, αὐτό", tr:"autós, autḗ, autó", fr:"lui, elle ; le même ; lui-même (selon la position)"},
    {gr:"ἐμαυτόν", tr:"emautón", fr:"moi-même (réfléchi)"}
  ],
  exercises:[

    {type:'qcm', q:"« De moi » (génitif) se dit, en forme atone…", opts:['ἐμοῦ','μου','ἐμοί','ἐμέ'], correct:1, explain:"μου est la forme atone, la plus fréquente."},
    {type:'qcm', q:"Faute d'un vrai pronom « il » non réfléchi, le grec utilise…", opts:['σύ','ἡμεῖς','une forme de αὐτός','ἐμαυτόν'], correct:2, explain:"αὐτός, αὐτή, αὐτό supplée l'absence de pronom de 3e personne non réfléchi."},
    {type:'text', q:"Écris « vous » (nominatif pluriel).", accepted:['ὑμεῖς','υμεις'], explain:"ὑμεῖς = vous (2e personne du pluriel)."},
    {type:'qcm', q:"ἐμαυτόν (« moi-même ») est un pronom…", opts:['personnel non réfléchi','réfléchi','réciproque','possessif'], correct:1, explain:"ἐμαυτόν est le pronom réfléchi de la 1ère personne."}
  ]
},
{
  title:"Comparatif et superlatif", grTitle:"Ὁ συγκριτικὸς καὶ ὁ ὑπερθετικός",
  blocks:[
    {type:'p', text:"Le comparatif (« plus... ») et le superlatif (« le plus... », « très... ») se forment le plus souvent en ajoutant un suffixe au thème de l'adjectif au positif."},
    {type:'table', caption:'Formation régulière : suffixes -τερος / -τατος', headers:['Positif','Comparatif','Superlatif'],
     rows:[['σοφός (sage)','σοφώτερος (plus sage)','σοφώτατος (très sage)'],['δίκαιος (juste)','δικαιότερος','δικαιότατος'],['ὀξύς (aigu)','ὀξύτερος','ὀξύτατος']]},
    {type:'rule', text:"Un certain nombre d'adjectifs très fréquents, souvent des adjectifs de qualité ou de défaut, ont un comparatif et un superlatif <b>irréguliers</b> en <b>-ίων / -ιστος</b> (ou complètement supplétifs, sur un autre radical) — exactement comme « bon, meilleur, le meilleur » en français."},
    {type:'table', caption:'Quelques comparatifs irréguliers fréquents', headers:['Positif','Comparatif','Superlatif'],
     rows:[['καλός (beau)','καλλίων (plus beau)','κάλλιστος (le plus beau)'],['κακός (mauvais)','χείρων / ἥττων (pire)','χείριστος (le pire)'],['μέγας (grand)','μείζων (plus grand)','μέγιστος (le plus grand)'],['ἀγαθός (bon)','ἀμείνων / βελτίων / κρείττων (meilleur)','ἄριστος / βέλτιστος / κράτιστος (le meilleur)']]},
    {type:'callout', kind:'info', text:"Ces comparatifs irréguliers ont laissé des traces directes en français savant : « aristocratie » vient de ἄριστος (le meilleur) + κράτος (le pouvoir) = « le pouvoir des meilleurs »."},
    {type:'p', text:"Le complément du comparatif (« que ») se construit soit avec ἤ + le même cas que le premier terme, soit, plus élégamment, avec le génitif seul."},
    {type:'example', items:[{gr:'σοφώτερός ἐστι τοῦ ἀδελφοῦ', tr:'sophṓterós esti toû adelphoû', fr:"il est plus sage que son frère (génitif de comparaison)"}]}

  vocab:[

  ],
  exercises:[
    {type:'qcm', q:"Le suffixe régulier du comparatif est…", opts:['-τερος','-τατος','-ίων','-ικός'], correct:0, explain:"-τερος, -τέρα, -τερον forme le comparatif régulier."},
    {type:'qcm', q:"« Le plus sage / très sage » se dit…", opts:['σοφώτερος','σοφώτατος','σοφός','σοφία'], correct:1, explain:"σοφώτατος, superlatif en -τατος."},
    {type:'qcm', q:"Le comparatif irrégulier de μέγας (grand) est…", opts:['μεγάλτερος','μείζων','μέγιστος uniquement','μεγαλώτερος'], correct:1, explain:"μείζων est le comparatif irrégulier ; μέγιστος en est le superlatif."},
    {type:'qcm', q:"Le complément du comparatif (« que ») peut se construire avec…", opts:['le génitif seul','le datif seul','ἤ suivi du même cas, ou le génitif seul','toujours le nominatif'], correct:2, explain:"Deux constructions possibles : ἤ + même cas, ou le génitif de comparaison."},
    {type:'text', q:"« Aristocratie » vient du superlatif grec signifiant…", accepted:['le meilleur','les meilleurs'], explain:"ἄριστος (le meilleur) + κράτος (pouvoir) = « le pouvoir des meilleurs »."}
  ]
},
{
  title:"La voix moyenne et passive", grTitle:"Ἡ μέση καὶ ἡ παθητικὴ φωνή",
  blocks:[
    {type:'p', text:"Le grec distingue trois voix : l'<b>active</b> (le sujet fait l'action : λύω, « je délie »), la <b>moyenne</b> (le sujet est directement intéressé à l'action, agit pour lui-même : λύομαι, « je délie pour moi, je me délie ») et la <b>passive</b> (le sujet subit l'action : λύομαι, « je suis délié »)."},
    {type:'table', caption:'Présent indicatif moyen-passif de λύω', headers:['Personne','Forme','Sens (selon contexte)'],
     rows:[['1sg','λύομαι','je me délie / je suis délié'],['2sg','λύῃ','tu te délies / tu es délié'],['3sg','λύεται','il se délie / il est délié'],['1pl','λυόμεθα','nous nous délions / nous sommes déliés'],['2pl','λύεσθε','vous vous déliez / vous êtes déliés'],['3pl','λύονται','ils se délient / ils sont déliés']]},
    {type:'rule', text:"Au présent (comme à l'imparfait, au parfait et au plus-que-parfait), la voix moyenne et la voix passive ont exactement les <b>mêmes formes</b> : seul le contexte permet de choisir entre les deux sens. Ce n'est qu'au futur et à l'aoriste que le passif prend des formes propres, marquées par le suffixe -θη-/-η- (ex. aoriste passif ἐλύθην, « je fus délié »)."},
    {type:'callout', kind:'info', text:"Certains verbes, dits <b>déponents</b>, n'existent qu'à la voix moyenne mais ont un sens actif : βούλομαι (« je veux »). D'autres changent carrément de sens selon la voix : ἄρχω « je commande » / ἄρχομαι « je commence » ; πείθω « je persuade » / πείθομαι « j'obéis, j'ai confiance »."}
  ],
  vocab:[
    {gr:"λύομαι", tr:"lúomai", fr:"je me délie / je suis délié"},
    {gr:"βούλομαι", tr:"boúlomai", fr:"je veux (déponent)"},
    {gr:"ἄρχομαι", tr:"árkhomai", fr:"je commence"},
    {gr:"πείθομαι", tr:"peíthomai", fr:"j'obéis, j'ai confiance"}
  ],
  exercises:[
    {type:'qcm', q:"La voix moyenne exprime en priorité…", opts:["que le sujet subit l'action","que le sujet est directement intéressé à l'action, agit pour lui-même","une action future","une négation"], correct:1, explain:"La voix moyenne marque l'intérêt direct du sujet à l'action qu'il accomplit."},
    {type:'qcm', q:"Au présent, moyen et passif…", opts:['ont des formes totalement différentes','ont exactement les mêmes formes','n\'existent pas','se distinguent par l\'augment'], correct:1, explain:"Au présent (et à l'imparfait, au parfait), moyen et passif partagent les mêmes formes ; seul le contexte tranche."},
    {type:'qcm', q:"Un verbe « déponent » comme βούλομαι…", opts:["n'a que des formes actives","n'a que des formes moyennes, mais un sens actif","n'existe qu'au passé","se conjugue comme εἰμί"], correct:1, explain:"βούλομαι n'a que des formes moyennes, mais se traduit par un sens actif : « je veux »."},
    {type:'qcm', q:"πείθω (je persuade) et πείθομαι (…) illustrent…", opts:["un changement de sens entre actif et moyen","la même chose exactement","un temps différent seulement","un mode différent"], correct:0, explain:"πείθομαι, à la voix moyenne, signifie « j'obéis, j'ai confiance », un sens distinct de l'actif πείθω."},
    {type:'text', q:"Ce qui distingue formellement le passif du moyen apparaît seulement à deux temps : le futur et…", accepted:['aoriste', "l'aoriste"], explain:"Au futur et à l'aoriste, le passif prend des formes propres en -θη-/-η-."}
  ]
},
{
  title:"L'infinitif", grTitle:"Τὸ ἀπαρέμφατον",
  blocks:[
    {type:'p', text:"L'infinitif grec fonctionne largement comme un nom verbal : il peut être sujet, complément d'objet, exprimer un but ou une destination, ou encore servir dans le discours indirect après des verbes de pensée, de parole ou de volonté."},
    {type:'table', caption:'Les infinitifs de λύω', headers:['Temps','Voix active','Voix moyenne-passive'],
     rows:[['Présent','λύειν','λύεσθαι'],['Futur','λύσειν','λύσεσθαι'],['Aoriste','λῦσαι','λύσασθαι'],['Parfait','λελυκέναι','λελύσθαι']]},
    {type:'example', items:[
      {gr:'βούλομαι μανθάνειν', tr:'boúlomai manthánein', fr:"je veux apprendre (infinitif complément d'un verbe de volonté)"},
      {gr:'καλόν ἐστι μανθάνειν', tr:'kalón esti manthánein', fr:"il est beau d'apprendre (infinitif sujet)"}
    ]},
    {type:'callout', kind:'info', text:"Repère : l'infinitif présent actif se reconnaît facilement à sa terminaison en -ειν (λύ-ειν) ; à la voix moyenne-passive, il se termine en -εσθαι (λύ-εσθαι)."}
  ],
  vocab:[],
  exercises:[
    {type:'qcm', q:"L'infinitif présent actif de λύω est…", opts:['λύει','λύειν','λύεσθαι','λῦσαι'], correct:1, explain:"λύειν, reconnaissable à sa terminaison -ειν."},
    {type:'qcm', q:"L'infinitif présent moyen-passif se reconnaît à la terminaison…", opts:['-ειν','-εσθαι','-ασθαι','-ναι'], correct:1, explain:"-εσθαι marque l'infinitif présent moyen-passif : λύεσθαι."},
    {type:'qcm', q:"Dans « βούλομαι μανθάνειν » (je veux apprendre), μανθάνειν est…", opts:["le sujet du verbe","un infinitif complément d'objet","un participe","un nom au génitif"], correct:1, explain:"μανθάνειν complète βούλομαι comme complément d'objet, à la façon d'un nom verbal."},
    {type:'text', q:"Écris l'infinitif aoriste actif de λύω.", accepted:['λῦσαι','λυσαι'], explain:"λῦσαι, infinitif aoriste actif."},
    {type:'qcm', q:"L'infinitif grec peut fonctionner comme…", opts:['sujet, complément d\'objet, ou but','seulement complément d\'objet','uniquement adjectif','uniquement adverbe'], correct:0, explain:"L'infinitif, nom verbal, remplit plusieurs fonctions : sujet, COD, but, discours indirect..."}
  ]
},
{
  title:"Le participe", grTitle:"Ἡ μετοχή",
  blocks:[
    {type:'p', text:"Le participe est un adjectif verbal : il se décline comme un adjectif (en genre, nombre, cas) tout en gardant le sens et parfois les compléments du verbe. Il peut être substantivé (« celui qui... »), épithète, apposé au sujet, ou attribut."},
    {type:'table', caption:'Participe présent actif de λύω : λύων, λύουσα, λῦον', headers:['Cas','Masculin','Féminin','Neutre'],
     rows:[['Nom. sg','λύων','λύουσα','λῦον'],['Gén. sg','λύοντος','λυούσης','λύοντος']]},
    {type:'example', items:[
      {gr:'ὁ λύων', tr:'ho lúōn', fr:"celui qui délie (participe substantivé)"},
      {gr:'ὁ ἄνθρωπος λύων ἀπέρχεται', tr:'ho ánthrōpos lúōn apérkhetai', fr:"l'homme s'en va en déliant / tout en déliant (participe apposé au sujet)"}
    ]},
    {type:'rule', text:"Le génitif du participe présent actif (-οντος au masc./neutre, -ούσης au féminin) le rattache à la même famille que les noms de la 3e déclinaison en consonne, ce qui explique sa déclinaison un peu particulière par rapport à un adjectif ordinaire."},
    {type:'callout', kind:'info', text:"Le participe substantivé (précédé de l'article) est une tournure extrêmement fréquente en grec, souvent traduite en français par une proposition relative : ὁ λέγων = « celui qui parle »."}
  ],
  vocab:[],
  exercises:[
    {type:'qcm', q:"Le participe grec se comporte grammaticalement comme…", opts:['un nom invariable','un adjectif, décliné en genre/nombre/cas','un adverbe','une préposition'], correct:1, explain:"Le participe s'accorde comme un adjectif tout en gardant le sens du verbe."},
    {type:'qcm', q:"Le participe présent actif masculin nominatif singulier de λύω est…", opts:['λύουσα','λῦον','λύων','λύοντος'], correct:2, explain:"λύων (masc.), λύουσα (fém.), λῦον (neutre)."},
    {type:'qcm', q:"« ὁ λύων » (avec l'article) se traduit le plus souvent par…", opts:['« délier »','« celui qui délie »','« il délie »','« pour délier »'], correct:1, explain:"Le participe substantivé, précédé de l'article, équivaut à une relative : « celui qui délie »."},
    {type:'text', q:"Écris le génitif singulier féminin du participe λύουσα.", accepted:['λυούσης','λυουσης'], explain:"λυούσης, génitif féminin singulier."},
    {type:'qcm', q:"Dans « ὁ ἄνθρωπος λύων ἀπέρχεται », λύων est un participe…", opts:['substantivé','épithète','apposé au sujet','attribut du complément'], correct:2, explain:"Le participe, ici sans article, s'accorde avec le sujet et le décrit dans l'action : c'est un participe apposé (« épithète détachée »)."}
  ]
},
{
  title:"Le parfait", grTitle:"Ὁ παρακείμενος",
  blocks:[
    {type:'p', text:"Le parfait exprime un état présent résultant d'une action passée achevée : « j'ai délié (et le résultat de cette action dure encore) » — à distinguer de l'aoriste, qui se contente de rapporter le fait passé sans insister sur ses conséquences présentes."},
    {type:'rule', text:"Le parfait se forme par un <b>redoublement</b> de la première consonne du radical suivie de -ε- (λύω → <b>λε</b>-λυ-), puis, pour de nombreux verbes, du suffixe -κ- et des désinences propres au parfait."},
    {type:'table', caption:'Parfait actif de λύω : λέλυκα', headers:['Personne','Forme'],
     rows:[['1sg','λέλυκα'],['2sg','λέλυκας'],['3sg','λέλυκε(ν)'],['1pl','λελύκαμεν'],['2pl','λελύκατε'],['3pl','λελύκασι(ν)']]},
    {type:'callout', kind:'info', text:"Si le verbe commence par une voyelle, le redoublement se réalise par un simple allongement de cette voyelle plutôt que par une répétition de consonne — exactement le même principe que l'augment temporel vu à l'imparfait."},
    {type:'example', items:[{gr:'γέγραφα', tr:'gégrapha', fr:"j'ai écrit (et l'écrit existe encore) — parfait de γράφω"}]}
  ],
  vocab:[],
  exercises:[
    {type:'qcm', q:"Le parfait, par rapport à l'aoriste, insiste sur…", opts:['la simple répétition de l\'action','le résultat présent d\'une action passée achevée','une action future','une supposition'], correct:1, explain:"Le parfait souligne qu'un état présent résulte d'une action passée."},
    {type:'qcm', q:"Le parfait se caractérise avant tout par…", opts:["l'augment ἐ-","le redoublement de la consonne initiale + ε","le suffixe -σ-","la désinence -μι"], correct:1, explain:"Le redoublement (λέ-λυκα) est la marque distinctive du parfait."},
    {type:'qcm', q:"« J'ai délié » (parfait 1ère pers. sg.) se dit…", opts:['λύω','ἔλυσα','λέλυκα','λύσω'], correct:2, explain:"λέλυκα, parfait actif."},
    {type:'text', q:"Écris le parfait 3e pers. sg. de λύω.", accepted:['λέλυκε','λέλυκεν','λελυκε','λελυκεν'], explain:"λέλυκε(ν)."},
    {type:'qcm', q:"Si un verbe commence par une voyelle, le redoublement du parfait se réalise par…", opts:['une répétition de la voyelle','un simple allongement de la voyelle','l\'ajout d\'un ε devant','la disparition de la voyelle'], correct:1, explain:"Comme à l'augment temporel de l'imparfait, la voyelle initiale s'allonge au lieu de se redoubler."}
  ]
},
{
  title:"Le subjonctif", grTitle:"Ἡ ὑποτακτική",
  blocks:[
    {type:'p', text:"Le subjonctif exprime l'éventualité envisagée comme probable, la volonté ou le but (dans les subordonnées introduites par ἵνα, « afin que »), ainsi que la défense à la 2e personne à l'aoriste (μή + subjonctif aoriste, « ne fais pas... », pour un futur ponctuel)."},
    {type:'table', caption:'Subjonctif présent actif : λύω et εἰμί', headers:['Personne','λύω','εἰμί'],
     rows:[['1sg','λύω','ὦ'],['2sg','λύῃς','ᾖς'],['3sg','λύῃ','ᾖ'],['1pl','λύωμεν','ὦμεν'],['2pl','λύητε','ἦτε'],['3pl','λύωσι(ν)','ὦσι(ν)']]},
    {type:'rule', text:"Le subjonctif se reconnaît à l'<b>allongement</b> des voyelles thématiques de l'indicatif présent : ο devient ω, ε devient η (λύ<b>ω</b>, λύ<b>ῃ</b>ς... au lieu de λύω, λύεις...). Il ressemble donc de très près à l'indicatif, mais avec des voyelles longues partout."},
    {type:'example', items:[{gr:'ἵνα μανθάνωμεν', tr:'hína manthánōmen', fr:"afin que nous apprenions (subordonnée de but)"}]},
    {type:'callout', kind:'info', text:"Attention à ne pas confondre 1sg indicatif λύω et 1sg subjonctif λύω, identiques par hasard pour ce verbe précis : c'est la 2e et la 3e personne (λύεις/λύῃς, λύει/λύῃ) qui révèlent clairement la différence."}
  ],
  vocab:[
    {gr:"ἵνα", tr:"hína", fr:"afin que (+ subjonctif)"},
    {gr:"μή", tr:"mḗ", fr:"ne... pas (négation du subjonctif, de l'impératif, de l'infinitif...)"}
  ],
  exercises:[
    {type:'qcm', q:"Le subjonctif se reconnaît en général par…", opts:["l'augment ἐ-","l'allongement des voyelles thématiques (ο→ω, ε→η)","le redoublement","le suffixe -σ-"], correct:1, explain:"ω et η remplacent les voyelles brèves ο/ε de l'indicatif présent."},
    {type:'qcm', q:'« Afin que » (+ subjonctif) se dit…', opts:['μή','ἵνα','ἤ','δέ'], correct:1, explain:"ἵνα introduit une subordonnée de but, suivie du subjonctif."},
    {type:'qcm', q:"Le subjonctif présent 2e pers. sg. de λύω est…", opts:['λύεις','λύῃς','λύοις','λύε'], correct:1, explain:"λύῃς, avec le η caractéristique du subjonctif."},
    {type:'text', q:"Écris le subjonctif présent de εἰμί à la 1ère personne du singulier.", accepted:['ὦ'], explain:"ὦ, subjonctif présent de εἰμί, 1sg."},
    {type:'qcm', q:"La négation du subjonctif (et de l'impératif) est…", opts:['οὐ','μή','οὐκ','οὐχ'], correct:1, explain:"μή, et non οὐ, est la négation employée avec le subjonctif, l'impératif et l'infinitif."}
  ]
},
{
  title:"L'optatif", grTitle:"Ἡ εὐκτική",
  blocks:[
    {type:'p', text:"L'optatif, littéralement « mode du souhait », exprime avant tout un souhait réalisable (« puissé-je... ! »), mais aussi l'éventualité dans un contexte passé, ou une condition potentielle (« si..., il se pourrait que... »). C'est un mode très caractéristique du grec, sans équivalent direct en français."},
    {type:'table', caption:'Optatif présent actif de λύω', headers:['Personne','Forme'],
     rows:[['1sg','λύοιμι'],['2sg','λύοις'],['3sg','λύοι'],['1pl','λύοιμεν'],['2pl','λύοιτε'],['3pl','λύοιεν']]},
    {type:'rule', text:"L'optatif des verbes thématiques comme λύω se forme avec le suffixe <b>-οι-</b> inséré entre le radical et la désinence — un repère sonore assez facile à reconnaître une fois qu'on le connaît."},
    {type:'example', items:[{gr:'εἴθε λύοιμι', tr:'eíthe lúoimi', fr:"puissé-je délier ! si seulement je déliais !"}]},
    {type:'callout', kind:'info', text:"L'optatif de souhait est souvent introduit par les particules εἴθε ou εἰ γάρ, comme un point d'exclamation grammatical : « si seulement... ! »."}
  ],
  vocab:[
    {gr:"εἴθε", tr:"eíthe", fr:"puisse..., si seulement... (souhait + optatif)"}
  ],
  exercises:[
    {type:'qcm', q:"L'optatif exprime avant tout…", opts:['un ordre','un souhait, ou une éventualité','une simple description','une négation'], correct:1, explain:"L'optatif est le mode du souhait et de l'éventualité, notamment dans le passé ou l'hypothèse."},
    {type:'qcm', q:"L'optatif présent des verbes thématiques comme λύω se marque par le suffixe…", opts:['-ω-','-οι-','-θη-','-κ-'], correct:1, explain:"-οι- s'insère entre le radical et la désinence : λύ-οι-μι."},
    {type:'qcm', q:'« Puissé-je délier ! » se dit…', opts:['λύω','λύοιμι','ἔλυσα','λύσω'], correct:1, explain:"λύοιμι, optatif présent 1ère personne du singulier."},
    {type:'text', q:"Quelle particule introduit typiquement un souhait à l'optatif (« si seulement... ») ?", accepted:['εἴθε','ειθε'], explain:"εἴθε introduit le souhait exprimé à l'optatif."},
    {type:'qcm', q:"Comparé au subjonctif (voyelles ω/η), l'optatif se reconnaît plutôt par…", opts:['la lettre ι insérée dans la désinence','l\'augment ἐ-','le redoublement','le suffixe -σ-'], correct:0, explain:"Le ι (dans -οι- ou -ιη-/-ι-) est le signal sonore de l'optatif."}
  ]
},
{
  title:"L'impératif", grTitle:"Ἡ προστακτική",
  blocks:[
    {type:'p', text:"L'impératif est le mode de l'ordre et de la défense. Il n'existe qu'aux 2e et 3e personnes (le grec n'a pas besoin d'un impératif de 1ère personne : pour « allons ! », il utilise le subjonctif dit « exhortatif », par exemple λύωμεν, « délions »)."},
    {type:'table', caption:'Impératif présent actif : λύω et εἰμί', headers:['Personne','λύω','εἰμί'],
     rows:[['2sg','λῦε (« délie ! »)','ἴσθι (« sois ! »)'],['3sg','λυέτω (« qu\'il délie ! »)','ἔστω (« qu\'il soit ! »)'],['2pl','λύετε (« déliez ! »)','ἔστε (« soyez ! »)'],['3pl','λυόντων (« qu\'ils délient ! »)','ἔστων (« qu\'ils soient ! »)']]},
    {type:'rule', text:"Pour interdire quelque chose (la <b>défense</b>), le grec emploie <b>μή + impératif présent</b> pour une interdiction durable ou générale, mais <b>μή + subjonctif aoriste</b> (jamais l'impératif aoriste) pour interdire un acte ponctuel."},
    {type:'example', items:[
      {gr:'λῦε τὸν δοῦλον', tr:'lûe tòn doûlon', fr:"délie l'esclave ! (ordre direct, 2e pers. sg.)"},
      {gr:'μὴ λῦε', tr:'mḕ lûe', fr:"ne délie pas (habituellement / en général)"}
    ]}
  ],
  vocab:[],
  exercises:[
    {type:'qcm', q:"L'impératif grec existe…", opts:["à toutes les personnes","seulement à la 2e et à la 3e personne","seulement à la 1ère personne","seulement au pluriel"], correct:1, explain:"Le grec n'a pas de 1ère personne de l'impératif : il utilise le subjonctif exhortatif à sa place."},
    {type:'qcm', q:'« Délie ! » (2e pers. sg.) se dit…', opts:['λύε','λῦε','λύεις','λύειν'], correct:1, explain:"λῦε, impératif présent 2e personne du singulier."},
    {type:'qcm', q:'« Sois ! » (impératif de εἰμί, 2sg) se dit…', opts:['ἐστί','εἶ','ἴσθι','ἔστω'], correct:2, explain:"ἴσθι = sois !"},
    {type:'qcm', q:"Pour interdire un acte ponctuel (« ne fais pas cela, maintenant »), le grec préfère…", opts:['μή + impératif aoriste','μή + subjonctif aoriste','οὐ + impératif présent','μή + indicatif'], correct:1, explain:"L'impératif aoriste n'est jamais utilisé à la forme négative : on emploie μή + subjonctif aoriste."},
    {type:'text', q:"Écris l'impératif présent 3e pers. sg. de λύω (« qu'il délie ! »).", accepted:['λυέτω','λυετω'], explain:"λυέτω, impératif de 3e personne."}
  ]
},
{
  title:"Les pronoms démonstratifs", grTitle:"Αἱ δεικτικαὶ ἀντωνυμίαι",
  blocks:[
    {type:'p', text:"Le grec distingue trois degrés d'éloignement dans ses démonstratifs : ὅδε (« celui-ci, qui va suivre » — annonce ce qu'on va dire), οὗτος (« celui-ci / celui-là », le plus général et le plus fréquent), et ἐκεῖνος (« celui-là, là-bas », marquant l'éloignement)."},
    {type:'table', caption:'Οὗτος, αὕτη, τοῦτο — « celui-ci, celui-là »', headers:['Cas','Masc. sg','Fém. sg','Neutre sg'],
     rows:[['Nom.','οὗτος','αὕτη','τοῦτο'],['Acc.','τοῦτον','ταύτην','τοῦτο'],['Gén.','τούτου','ταύτης','τούτου'],['Dat.','τούτῳ','ταύτῃ','τούτῳ']]},
    {type:'rule', text:"οὗτος se décline presque comme l'article : un <b>esprit rude</b> au nominatif masculin et féminin, puis un <b>τ</b> à tous les autres cas — un repère très reconnaissable une fois vu."},
    {type:'example', items:[
      {gr:'τάδε λέγω', tr:'táde légō', fr:"voici ce que je dis (ὅδε annonce ce qui suit)"},
      {gr:'ἐκεῖνος ὁ ἀνήρ σοφός ἐστιν', tr:'ekeînos ho anḗr sophós estin', fr:"cet homme-là (au loin) est sage"}
    ]}
  ],
  vocab:[
    {gr:"οὗτος, αὕτη, τοῦτο", tr:"hoûtos, haútē, toûto", fr:"celui-ci, celui-là (le plus courant)"},
    {gr:"ὅδε, ἥδε, τόδε", tr:"hóde, hḗde, tóde", fr:"celui-ci (qui va suivre, très proche)"},
    {gr:"ἐκεῖνος, ἐκείνη, ἐκεῖνο", tr:"ekeînos, ekeínē, ekeîno", fr:"celui-là (là-bas, éloigné)"}
  ],
  exercises:[
    {type:'qcm', q:"Parmi les trois démonstratifs, lequel marque l'éloignement (« celui-là, là-bas ») ?", opts:['ὅδε','οὗτος','ἐκεῖνος','αὐτός'], correct:2, explain:"ἐκεῖνος marque la plus grande distance, à l'opposé de ὅδε (proximité immédiate)."},
    {type:'qcm', q:"Au nominatif singulier masculin et féminin, οὗτος et αὕτη commencent par…", opts:['un τ','un esprit rude','un esprit doux suivi de ν','un κ'], correct:1, explain:"L'esprit rude marque le nominatif ; ailleurs, la première syllabe commence par τ."},
    {type:'qcm', q:"Le génitif singulier féminin de οὗτος est…", opts:['ταύτης','τούτου','ταύτῃ','αὕτη'], correct:0, explain:"ταύτης, génitif féminin singulier."},
    {type:'text', q:"Écris l'accusatif masculin singulier de οὗτος.", accepted:['τοῦτον','τουτον'], explain:"τοῦτον, accusatif masculin singulier."},
    {type:'qcm', q:"ὅδε, contrairement à οὗτος, sert surtout à…", opts:['désigner un objet lointain','annoncer ce qu\'on va dire, dans l\'instant présent','poser une question','exprimer un souhait'], correct:1, explain:"ὅδε (« celui-ci, qui va suivre ») annonce ce qui vient d'être ou va être dit, en présentant."}
  ]
},
{
  title:"Le pronom relatif", grTitle:"Ἡ ἀναφορικὴ ἀντωνυμία",
  blocks:[
    {type:'p', text:"Le pronom relatif ὅς, ἥ, ὅ (« qui, que, dont... ») introduit une proposition relative. Il s'accorde en <b>genre</b> et en <b>nombre</b> avec son antécédent, mais prend le <b>cas</b> qui correspond à sa propre fonction à l'intérieur de la relative — ce qui peut donner un cas différent de celui de l'antécédent."},
    {type:'table', caption:'Ὅς, ἥ, ὅ — qui, que', headers:['Cas','Masc. sg','Fém. sg','Neutre sg','Masc. pl','Fém. pl','Neutre pl'],
     rows:[['Nom.','ὅς','ἥ','ὅ','οἵ','αἵ','ἅ'],['Acc.','ὅν','ἥν','ὅ','οὕς','ἅς','ἅ'],['Gén.','οὗ','ἧς','οὗ','ὧν','ὧν','ὧν'],['Dat.','ᾧ','ᾗ','ᾧ','οἷς','αἷς','οἷς']]},
    {type:'callout', kind:'warn', text:"Ne confonds pas le pronom relatif (ὅς, ἥ — esprit rude, accentué) avec l'article (ὁ, ἡ — esprit doux, généralement sans accent) : la seule différence graphique est parfois cet esprit et cet accent, mais le sens change du tout au tout."},
    {type:'example', items:[
      {gr:'ὁ ἀνὴρ ὃν ὁρῶ σοφός ἐστιν', tr:'ho anḕr hòn horỗ sophós estin', fr:"l'homme que je vois est sage (ὅν est à l'accusatif, COD de ὁρῶ, bien que l'antécédent ὁ ἀνήρ soit au nominatif, sujet)"}
    ]},
    {type:'rule', text:"Cette règle (accord en genre/nombre avec l'antécédent, mais cas déterminé par la fonction dans la relative) est l'un des points les plus importants à automatiser pour bien lire des phrases grecques suivies."}
  ],
  vocab:[
    {gr:"ὅς, ἥ, ὅ", tr:"hós, hḗ, hó", fr:"qui, que, dont (pronom relatif)"}
  ],
  exercises:[
    {type:'qcm', q:"Le pronom relatif s'accorde avec son antécédent en…", opts:['cas seulement','genre et nombre (le cas dépend de sa fonction dans la relative)','cas et nombre uniquement','rien du tout'], correct:1, explain:"Genre et nombre suivent l'antécédent ; le cas dépend uniquement de la fonction du relatif dans sa propre proposition."},

const STATE = {
  lesson: 0,
  tab: 'cours',
  points: 0,
  streak: 0,

  exScore: {},   // lessonIndex -> {correct, total, done:bool}

};

/* =========================================================================
   SYNTHÈSE VOCALE
   ========================================================================= */
let GR_VOICE = null;
function loadGrVoice(){
  try{
    const voices = window.speechSynthesis.getVoices();
    GR_VOICE = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('el')) || null;
  }catch(e){}
}
if(typeof window!=='undefined' && 'speechSynthesis' in window){
  loadGrVoice();
  window.speechSynthesis.onvoiceschanged = loadGrVoice;
}
function speakGr(text, btn){
  try{
    if(!('speechSynthesis' in window)){ showToast("La synthèse vocale n'est pas disponible sur ce navigateur."); return; }
    window.speechSynthesis.cancel();
    const clean = (text||'').replace(/\s+/g,' ').trim();
    if(!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'el-GR';
    u.rate = 0.82;
    if(GR_VOICE) u.voice = GR_VOICE;
    if(btn){ btn.classList.add('playing'); u.onend=()=>btn.classList.remove('playing'); u.onerror=()=>btn.classList.remove('playing'); }
    window.speechSynthesis.speak(u);
  }catch(e){ console.error(e); }
}
window.speakGr = speakGr;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* =========================================================================
   SAUVEGARDE — GOOGLE APPS SCRIPT
   ========================================================================= */
async function gasCall(action, payload){
  if(!STATE.gasUrl) return {ok:false, error:'Aucune URL de sauvegarde configurée.'};
  try{
    const res = await fetch(STATE.gasUrl, {method:'POST', body: JSON.stringify(Object.assign({action}, payload||{}))});
    return await res.json();
  }catch(e){ return {ok:false, error:'Connexion au serveur impossible : '+e}; }
}

async function saveProgress(retriesLeft){
  if(!STATE.user) return; // invité : rien à sauvegarder
  if(retriesLeft === undefined) retriesLeft = 3;
  // On envoie toujours l'état complet (points, leçons validées), jamais une
  // simple différence : si cette tentative échoue, la prochaine sauvegarde
  // réussie (celle-ci en réessai, ou la suivante déclenchée par une future
  // action) enverra de toute façon la version à jour. Rien n'est donc perdu
  // tant qu'au moins une sauvegarde finit par passer avant la fermeture de
  // l'onglet.
  const r = await gasCall('save', {
    name: STATE.user.name,
    code: STATE.user.code,
    points: STATE.points,
    completedLessons: [...STATE.completed]
  });
  if((!r || !r.ok) && retriesLeft > 0){
    setTimeout(()=>saveProgress(retriesLeft-1), 4000);
  } else if(!r || !r.ok){
    showToast("Sauvegarde momentanément indisponible (coupure Google ?) — ta progression restera à jour dès que la connexion reviendra.");
  }
}
window.saveProgress = saveProgress;

function settingsScreenHTML(err){
  return `<div class="authscreen"><div class="authcard">
    <div class="mark2">⚙</div>
    <h2>Configurer la sauvegarde</h2>
    <div class="sub">Colle ici l'URL de ton application Google Apps Script (voir les instructions de déploiement fournies avec ce fichier).</div>
    <label>URL de l'application web</label>
    <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn-ghost" style="width:100%;margin-top:10px;" onclick="testGasConnection()">Tester la connexion</button>
    <div class="errmsg" id="gasMsg"></div>
    <button class="navbtn" onclick="saveGasUrl()">Enregistrer</button>
    <button class="altlink" onclick="continueAsGuest()">Continuer sans sauvegarde (mode invité)</button>
    <div class="errmsg">${err||''}</div>
  </div></div>`;
}
function loginScreenHTML(prefillName, err){
  return `<div class="authscreen"><div class="authcard">
    <div class="mark2">Ω</div>
    <h2>Bienvenue</h2>
    <div class="sub">Entre ton prénom et un code personnel. Le compte se crée automatiquement la première fois — retiens bien ton code, il te permettra de retrouver ta progression.</div>
    <label>Prénom</label>
    <input type="text" id="loginName" value="${prefillName?esc(prefillName):''}" placeholder="ex : Léa">
    <label>Code personnel</label>
    <input type="password" id="loginCode" placeholder="ex : 1234">
    <button class="navbtn" onclick="submitLogin()">Se connecter</button>
    <button class="altlink" onclick="continueAsGuest()">Continuer sans compte (invité)</button>
    <button class="altlink" onclick="renderScreen(settingsScreenHTML())">⚙ Changer l'URL de sauvegarde</button>
    <div class="errmsg">${err||''}</div>
  </div></div>`;
}
function renderScreen(html){
  let ov = document.getElementById('authOverlay');
  if(!ov){ ov = document.createElement('div'); ov.id='authOverlay'; document.body.appendChild(ov); }
  ov.innerHTML = html;
}
function removeAuthOverlay(){
  const ov = document.getElementById('authOverlay');
  if(ov) ov.remove();
}
function saveGasUrl(){
  const val = (document.getElementById('gasUrlInput').value||'').trim();
  if(!val){ renderScreen(settingsScreenHTML("Merci de coller une URL.")); return; }
  localStorage.setItem('grec_gas_url', val);
  STATE.gasUrl = val;
  renderScreen(loginScreenHTML());
}
async function testGasConnection(){
  const input = document.getElementById('gasUrlInput');
  const url = (input.value||'').trim();
  const msg = document.getElementById('gasMsg');
  if(!url){ msg.style.color='var(--red)'; msg.textContent='Colle une URL avant de tester.'; return; }
  msg.style.color='var(--text-soft)'; msg.textContent='Test en cours…';
  try{
    const res = await fetch(url, {method:'POST', body: JSON.stringify({action:'ping'})});
    const r = await res.json();
    if(r && r.ok){ msg.style.color='var(--green)'; msg.textContent='Connexion réussie ✓ — le script répond correctement.'; }
    else{ msg.style.color='var(--red)'; msg.textContent="Le script répond mais renvoie une erreur : "+((r&&r.error)||'inconnue')+"."; }
  }catch(e){ msg.style.color='var(--red)'; msg.textContent="Connexion impossible. Vérifie l'URL et le déploiement (accès = Tout le monde)."; }
}
window.testGasConnection = testGasConnection;
function continueAsGuest(){
  STATE.guest = true;
  STATE.user = null;
  removeAuthOverlay();
  render();
}
async function submitLogin(){
  const name = (document.getElementById('loginName').value||'').trim();
  const code = (document.getElementById('loginCode').value||'').trim();
  if(!name || !code){ renderScreen(loginScreenHTML(name,'Prénom et code requis.')); return; }
  renderScreen(loginScreenHTML(name,'Connexion…'));
  const r = await gasCall('login', {name, code});
  if(!r || !r.ok){ renderScreen(loginScreenHTML(name, (r&&r.error)||'Connexion impossible.')); return; }
  applyLogin(name, code, r);
}
function applyLogin(name, code, r){
  STATE.user = {name, code};
  STATE.guest = false;
  STATE.points = r.points||0;
  STATE.completed = new Set((r.completedLessons||[]).map(Number));
  localStorage.setItem('grec_user_name', name);
  localStorage.setItem('grec_user_code', code);
  removeAuthOverlay();
  render();
  showToast(r.isNew ? 'Compte créé — bienvenue !' : 'Progression restaurée.');
}
function logout(){
  localStorage.removeItem('grec_user_name');
  localStorage.removeItem('grec_user_code');
  STATE.user = null; STATE.guest = false;
  STATE.points = 0; STATE.streak = 0; STATE.completed = new Set();
  STATE.lesson = 0; STATE.tab = 'cours';
  renderScreen(loginScreenHTML());
}
window.saveGasUrl = saveGasUrl;
window.continueAsGuest = continueAsGuest;
window.submitLogin = submitLogin;
window.logout = logout;

function withTimeout_(promise, ms, timeoutMsg){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(() => resolve({ ok:false, error: timeoutMsg || 'Délai dépassé.' }), ms))
  ]);
}

async function boot(){
  const url = localStorage.getItem('grec_gas_url')||'';
  STATE.gasUrl = url;
  render(); // l'appli est utilisable tout de suite, la connexion se fait en arrière-plan
  if(!url){ renderScreen(settingsScreenHTML()); return; }
  const savedName = localStorage.getItem('grec_user_name');
  const savedCode = localStorage.getItem('grec_user_code');
  if(!savedName || !savedCode){ renderScreen(loginScreenHTML()); return; }

  STATE.guest = true; // en attendant la réponse, on n'est pas bloqué
  showToast('Connexion en cours…');
  const r = await withTimeout_(
    gasCall('login', {name:savedName, code:savedCode}),
    10000,
    'La connexion prend trop de temps — tu peux continuer, ta progression se sauvegardera dès que le serveur répondra.'
  );
  if(r && r.ok){
    STATE.user = {name:savedName, code:savedCode};
    STATE.guest = false;
    STATE.points += (r.points||0);
    (r.completedLessons||[]).forEach(n => STATE.completed.add(Number(n)));
    refreshTopStats(); renderSidebar();
    showToast(r.isNew ? 'Compte créé — bienvenue !' : 'Progression restaurée.');
  } else {
    showToast((r&&r.error) || 'Connexion impossible pour le moment — mode invité.');
  }
}

/* =========================================================================
   RENDU : BLOCS DE COURS
   ========================================================================= */
function esc(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function grSpan(text){ return `<span class="gr" onclick="speakGr('${esc(text).replace(/'/g,"&#39;")}', this)">${text}</span>`; }

function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.type==='p') return `<p>${b.text}</p>`;
    if(b.type==='rule') return `<div class="rule">${b.text}</div>`;
    if(b.type==='callout'){
      const ico = b.kind==='warn' ? '⚠️' : '💡';
      return `<div class="callout ${b.kind}"><span class="ico">${ico}</span><span>${b.text}</span></div>`;
    }
    if(b.type==='example'){
      return b.items.map(it=>`<div class="example">${grSpan(it.gr)}<span class="tr">${it.tr}</span><span class="fr">${it.fr}</span></div>`).join('');
    }
    if(b.type==='table'){
      const gc = b.greekCols || [];
      const thead = '<tr>'+b.headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';
      const tbody = b.rows.map(r=>'<tr>'+r.map((c,i)=> gc.includes(i) ? `<td>${grSpan(c)}</td>` : `<td>${c}</td>`).join('')+'</tr>').join('');
      const cap = b.caption ? `<caption>${b.caption}</caption>` : '';
      return `<div class="tblwrap"><table class="gridtbl">${cap}${thead}${tbody}</table></div>`;
    }
    return '';
  }).join('');
}

function renderVocab(vocab){
  return `<div class="vocab-grid">` + vocab.map(v=>`
    <div class="vcard">
      <div class="front">
        ${grSpan(v.gr)}
        <span class="tr">${v.tr}</span>
      </div>
      <div class="back">${v.fr}</div>
    </div>`).join('') + `</div>`;
}

/* =========================================================================
   RENDU : EXERCICES
   ========================================================================= */
function startExercises(li){
  STATE.exIndex[li] = 0;
  STATE.exAnswered = false;
  if(!STATE.exScore[li]) STATE.exScore[li] = {correct:0, total:0, done:false};
  STATE.exScore[li] = {correct:0, total:0, done:false};
  render();
}
window.startExercises = startExercises;

function renderExerciseView(li){
  const lesson = LESSONS[li];
  const exs = lesson.exercises;
  const qi = STATE.exIndex[li];

  if(qi === undefined){
    return `<div class="card">
      <h3><span class="en">Entraînement</span>Exercices</h3>
      <p>${exs.length} questions pour vérifier ce que tu as retenu de ce cours : choix multiples et réponses à écrire, avec le clavier grec de ton clavier habituel (copie-colle si besoin depuis le cours).</p>
      <button class="navbtn" onclick="startExercises(${li})">▶ Commencer les exercices</button>
    </div>`;
  }

  if(qi >= exs.length){
    const sc = STATE.exScore[li];
    const pct = Math.round(100*sc.correct/sc.total);
    let badge = '';
    if(pct>=70 && !STATE.completed.has(li)){
      STATE.completed.add(li);
      badge = `<div class="badge">🏅 Leçon validée !</div>`;
      saveProgress();
    }
    return `<div class="card">
      <div class="resultbox">
        <div class="ui" style="font-size:12px;color:var(--gold-dim);letter-spacing:.1em;text-transform:uppercase;">Résultat</div>
        <div class="score">${sc.correct} / ${sc.total}</div>
        <p class="ui" style="color:var(--text-soft);">${pct}% de bonnes réponses — tu as gagné ${sc.correct*10} points.</p>
        ${badge}
        <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;">
          <button class="btn-ghost" onclick="startExercises(${li})">↻ Refaire</button>
          ${li < LESSONS.length-1 ? `<button class="navbtn" onclick="STATE.lesson=${li+1};STATE.tab='cours';render()">Leçon suivante →</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  const ex = exs[qi];
  const pct = Math.round(100*qi/exs.length);
  let body = '';
  if(ex.type==='qcm'){
    body = `<div class="optiongrid">` + ex.opts.map((o,i)=>
      `<button class="optbtn" id="opt${i}" onclick="answerQcm(${li},${i})">${o}</button>`
    ).join('') + `</div>`;
  } else {
    body = `<div class="answerrow">
      <input type="text" id="textAnswer" placeholder="Écris ta réponse ici…" onkeydown="if(event.key==='Enter')answerText(${li})">
      <button class="navbtn" onclick="answerText(${li})">Valider</button>
    </div>`;
  }

  return `<div class="card">
    <div class="progressbar"><div style="width:${pct}%;"></div></div>
    <div class="qmeta">Question ${qi+1} / ${exs.length} · ${STATE.points} pts · série en cours : ${STATE.streak}</div>
    <div class="qbox" style="margin-top:10px;box-shadow:none;border:none;padding:18px 0 0;">
      <div class="qprompt"><span class="fr">${ex.q}</span></div>
      ${body}
      <div class="explain" id="explainBox"></div>
      <div class="qfoot">
        <span></span>
        <button class="navbtn" id="nextBtn" style="display:none;" onclick="nextExercise(${li})">Suivant →</button>
      </div>
    </div>
  </div>`;
}

function lockOptions(){
  document.querySelectorAll('.optbtn').forEach(b=>b.disabled=true);
}
function showExplain(text, correct){
  const box = document.getElementById('explainBox');
  box.innerHTML = (correct?'✅ ':'❌ ') + text;
  box.classList.add('show');
  document.getElementById('nextBtn').style.display='inline-flex';
}
function registerAnswer(li, correct){
  if(STATE.exAnswered) return false;
  STATE.exAnswered = true;
  STATE.exScore[li].total++;
  if(correct){ STATE.exScore[li].correct++; STATE.points+=10; STATE.streak++; }
  else{ STATE.streak=0; }
  refreshTopStats();
  saveProgress();
  return true;
}
function answerQcm(li, idx){
  if(STATE.exAnswered) return;
  const ex = LESSONS[li].exercises[STATE.exIndex[li]];
  const correct = idx===ex.correct;
  if(!registerAnswer(li, correct)) return;
  lockOptions();
  document.getElementById('opt'+ex.correct).classList.add('correct');
  if(!correct) document.getElementById('opt'+idx).classList.add('wrong');
  showExplain(ex.explain||'', correct);
}
function answerText(li){
  if(STATE.exAnswered) return;
  const ex = LESSONS[li].exercises[STATE.exIndex[li]];
  const input = document.getElementById('textAnswer');
  const val = (input.value||'').trim().toLowerCase();
  const correct = ex.accepted.some(a=>a.toLowerCase()===val);
  if(!registerAnswer(li, correct)) return;
  input.disabled = true;
  showExplain(ex.explain||'', correct);
}
window.answerQcm = answerQcm;
window.answerText = answerText;
function nextExercise(li){
  STATE.exIndex[li]++;
  STATE.exAnswered = false;
  render();
}
window.nextExercise = nextExercise;

/* =========================================================================
   NAVIGATION / RENDU GÉNÉRAL
   ========================================================================= */
function refreshTopStats(){
  const p = document.getElementById('statPoints');
  const s = document.getElementById('statStreak');
  const c = document.getElementById('statDone');
  if(p) p.textContent = STATE.points;
  if(s) s.textContent = STATE.streak;
  if(c) c.textContent = STATE.completed.size + '/' + LESSONS.length;
}

function renderSidebar(){
  const items = LESSONS.map((l,i)=>{
    const ord = ['Α΄','Β΄','Γ΄','Δ΄','Ε΄','Ϛ΄','Ζ΄','Η΄','Θ΄','Ι΄','ΙΑ΄','ΙΒ΄','ΙΓ΄','ΙΔ΄','ΙΕ΄','ΙϚ΄','ΙΖ΄','ΙΗ΄','ΙΘ΄','Κ΄','ΚΑ΄','ΚΒ΄','ΚΓ΄','ΚΔ΄','ΚΕ΄','ΚϚ΄'][i] || (i+1);
    const cls = 'navitem' + (i===STATE.lesson?' active':'') + (STATE.completed.has(i)?' done':'');
    return `<div class="${cls}" onclick="STATE.lesson=${i};STATE.tab='cours';render()">
      <span class="num">${ord}</span><span>${l.title}</span>
    </div>`;
  }).join('');
  const userRow = STATE.user
    ? `<div class="userbadge"><span>👤 ${esc(STATE.user.name)}</span><button onclick="logout()">changer</button></div>`
    : `<div class="userbadge"><span>👤 Invité (non sauvegardé)</span><button onclick="renderScreen(loginScreenHTML())">se connecter</button></div>`;
  document.getElementById('sidebar').innerHTML = `
    <div class="brand">
      <div class="mark">Ω</div>
      <div><div class="name">Grec Ancien</div><div class="sub">μάθε παίζων — apprends en jouant</div></div>
    </div>
    ${userRow}
    <div class="statbar">
      <div class="statchip"><b id="statPoints">${STATE.points}</b>points</div>
      <div class="statchip"><b id="statStreak">${STATE.streak}</b>série</div>
      <div class="statchip"><b id="statDone">${STATE.completed.size}/${LESSONS.length}</b>leçons</div>
    </div>
    <div class="navgroup">
      <div class="label">Parcours</div>
      ${items}
    </div>`;
}

function renderMain(){
  const li = STATE.lesson;
  const lesson = LESSONS[li];
  const tabs = ['cours','vocabulaire','exercices'];
  const tabLabels = {cours:'Cours', vocabulaire:'Vocabulaire', exercices:'Exercices'};
  const tabbar = tabs.map(t=>`<button class="tabbtn${STATE.tab===t?' active':''}" onclick="STATE.tab='${t}';render()">${tabLabels[t]}</button>`).join('');

  let content = '';
  if(STATE.tab==='cours'){
    content = `<div class="card">${renderBlocks(lesson.blocks)}</div>`;
  } else if(STATE.tab==='vocabulaire'){
    content = lesson.vocab.length
      ? `<div class="card"><h3><span class="en">Mots à retenir</span>Vocabulaire de la leçon</h3>${renderVocab(lesson.vocab)}</div>`
      : `<div class="card"><h3><span class="en">Mots à retenir</span>Vocabulaire de la leçon</h3><p>Pas de nouveau vocabulaire ici : cette leçon est centrée sur la grammaire. Profites-en pour réviser les mots des leçons précédentes.</p></div>`;
  } else {
    content = renderExerciseView(li);
  }

  document.getElementById('main').innerHTML = `
    <div class="topline">
      <div>
        <div class="eyebrow">Leçon ${li+1} / ${LESSONS.length}</div>
        <h1>${lesson.title}</h1>
        <div class="grtitle">${lesson.grTitle}</div>
      </div>
    </div>
    <div class="tabbar">${tabbar}</div>
    ${content}
    <div class="lesson-nav">
      <button class="btn-ghost" ${li===0?'disabled':''} onclick="STATE.lesson=${li-1};STATE.tab='cours';render()">← Leçon précédente</button>
      <button class="btn-ghost" ${li===LESSONS.length-1?'disabled':''} onclick="STATE.lesson=${li+1};STATE.tab='cours';render()">Leçon suivante →</button>
    </div>`;
}

function render(){
  renderSidebar();
  renderMain();
}

/* INIT */
boot();
</script>
</body>
</html>
